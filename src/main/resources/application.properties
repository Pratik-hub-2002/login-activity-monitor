spring.application.name=login-activity-monitor

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/login_activity_monitor}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# hCaptcha Configuration
app.captcha.hcaptcha.site-key=${HCAPTCHA_SITE_KEY:}
app.captcha.hcaptcha.secret=${HCAPTCHA_SECRET:}
app.captcha.hcaptcha.required=${HCAPTCHA_REQUIRED:false}

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# Notification Configuration
app.notification.admin-email=${APP_NOTIFICATION_ADMIN_EMAIL:}
app.notification.user-emails=${APP_NOTIFICATION_USER_EMAILS:}
app.notification.from=${APP_NOTIFICATION_FROM:${spring.mail.username:no-reply@localhost}}
app.auth.otp.validity-seconds=${APP_AUTH_OTP_VALIDITY_SECONDS:90}
